name: Release on tag

# Triggers on tag pushes matching v* (semver-like). Each phase commit is
# tagged v0.4.x; this workflow auto-creates a GitHub Release whose body is
# the tag's annotated message + the commit message body. The result is a
# browsable release log at https://github.com/kyoubelyu/mai-agent/releases
# that mirrors the per-phase ROADMAP entries without manual gh CLI work.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full history to read tag annotation

      - name: Build release notes
        id: notes
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Prefer annotated tag message; fall back to commit subject + body
          ANNOTATED=$(git tag -l --format='%(contents)' "$TAG")
          if [ -z "${ANNOTATED// /}" ]; then
            ANNOTATED=$(git log -1 --pretty=%B "$TAG")
          fi

          # Persist multi-line output via heredoc syntax
          {
            echo "body<<EOF_NOTES"
            echo "$ANNOTATED"
            echo ""
            echo "---"
            echo "Auto-generated by .github/workflows/release.yml on tag push."
            echo "EOF_NOTES"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pass via env (NOT ${{}} substitution in run-script body) to avoid
          # bash parser breakage when tag body contains parens/quotes/backticks.
          # GH Actions textually substitutes ${{}} BEFORE bash sees the script;
          # env vars are set safely and read at runtime.
          TAG: ${{ steps.notes.outputs.tag }}
          NOTES: ${{ steps.notes.outputs.body }}
        run: |
          printf '%s' "$NOTES" | gh release create "$TAG" \
            --title "$TAG" \
            --notes-file - \
            --verify-tag \
            install.sh
