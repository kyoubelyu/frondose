name: Public Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-latest
    environment: public-release
    outputs:
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      dmg-sha256: ${{ steps.verified.outputs.dmg-sha256 }}
      app-tar-sha256: ${{ steps.verified.outputs.app-tar-sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - name: Verify pinned build tools
        run: |
          node --version
          npx --no-install tauri --version
          npm exec --offline -- cyclonedx-npm --version
          7z --help >/dev/null
      - name: Build and verify native candidate
        run: bash scripts/build-public-macos.sh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          FRONDOSE_PUBLIC_OUTPUT_DIR: build/public-macos
      - id: verified
        name: Verify native candidate
        run: |
          test -f build/public-macos/verified-producer-manifest.json
          echo "dmg-sha256=$(node -p 'require("./build/public-macos/verified-producer-manifest.json").sha256.dmg')" >> "$GITHUB_OUTPUT"
          echo "app-tar-sha256=$(node -p 'require("./build/public-macos/verified-producer-manifest.json").sha256.appTar')" >> "$GITHUB_OUTPUT"
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-macos-producer
          path: build/public-macos
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    environment: public-release
    outputs:
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      windows-exe-sha256: ${{ steps.verified.outputs.windows-exe-sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - name: Verify pinned build tools
        shell: pwsh
        run: |
          node --version
          npx.cmd --no-install tauri --version
          npm.cmd exec --offline -- cyclonedx-npm --version
          Get-Command Get-FileHash | Out-Null
          7z --help | Out-Null
      - name: Build and verify native candidate
        shell: pwsh
        run: ./scripts/build-public-windows.ps1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          FRONDOSE_PUBLIC_OUTPUT_DIR: build/public-windows
      - id: verified
        name: Verify native candidate
        shell: pwsh
        run: |
          if (-not (Test-Path build/public-windows/verified-producer-manifest.json)) { throw "producer manifest missing" }
          $manifest = Get-Content -Raw build/public-windows/verified-producer-manifest.json | ConvertFrom-Json
          "windows-exe-sha256=$($manifest.sha256.windowsExe)" >> $env:GITHUB_OUTPUT
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-windows-producer
          path: build/public-windows
          if-no-files-found: error

  inspect:
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows]
    outputs:
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: public-macos-producer
          path: artifacts/macos
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: public-windows-producer
          path: artifacts/windows
      - name: Bind producer manifests to downloaded artifact digests
        run: |
          node -e 'const fs=require("fs"); fs.writeFileSync("artifacts/verified-producers.json", JSON.stringify({sha256:{dmg:process.env.DMG_SHA,appTar:process.env.APP_TAR_SHA,windowsExe:process.env.WINDOWS_EXE_SHA},artifactDigests:{macos:process.env.MAC_DIGEST,windows:process.env.WINDOWS_DIGEST}},null,2));'
        env:
          MAC_DIGEST: ${{ needs.build-macos.outputs.artifact-digest }}
          WINDOWS_DIGEST: ${{ needs.build-windows.outputs.artifact-digest }}
          DMG_SHA: ${{ needs.build-macos.outputs.dmg-sha256 }}
          APP_TAR_SHA: ${{ needs.build-macos.outputs.app-tar-sha256 }}
          WINDOWS_EXE_SHA: ${{ needs.build-windows.outputs.windows-exe-sha256 }}
      - name: Assemble exact public release
        run: node scripts/assemble-public-release.mjs
        env:
          FRONDOSE_MACOS_PRODUCER_DIR: artifacts/macos
          FRONDOSE_WINDOWS_PRODUCER_DIR: artifacts/windows
          FRONDOSE_VERIFIED_PRODUCER_MANIFEST: artifacts/verified-producers.json
          FRONDOSE_PUBLIC_OUTPUT_DIR: build/public-release
          FRONDOSE_RELEASE_VERSION: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Verify native candidate handoff
        run: |
          cargo build --release --manifest-path scripts/updater-verifier/Cargo.toml
          key="$(node -e 'const c=require("./src/tauri/src-tauri/tauri.conf.json"); process.stdout.write(Buffer.from(c.plugins.updater.pubkey,"base64").toString("utf8").trim().split(/\r?\n/)[1])')"
          scripts/updater-verifier/target/release/frondose-updater-verifier "$key" build/public-release/Frondose.app.tar.gz build/public-release/Frondose.app.tar.gz.sig
          scripts/updater-verifier/target/release/frondose-updater-verifier "$key" build/public-release/Frondose-windows-x86_64-setup.exe build/public-release/Frondose-windows-x86_64-setup.exe.sig
          node scripts/public-release-policy.mjs inspect
        env:
          FRONDOSE_RELEASE_DIR: build/public-release
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-release-candidate
          path: build/public-release
          if-no-files-found: error

  attest:
    runs-on: ubuntu-latest
    needs: inspect
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: public-release-candidate
          path: release
      - name: Confirm attestation-subjects.txt is canonical
        run: test "$(wc -l < release/attestation-subjects.txt)" -eq 9
      - uses: actions/attest-build-provenance@520d128f165991a6c774bcb264f323e3d70747f4
        with:
          subject-path: |
            release/Frondose-universal.dmg
            release/Frondose.app.tar.gz
            release/Frondose.app.tar.gz.sig
            release/Frondose-windows-x86_64-setup.exe
            release/Frondose-windows-x86_64-setup.exe.sig
            release/latest.json
            release/SHA256SUMS
            release/sbom.cdx.json
            release/provenance.json

  draft:
    runs-on: ubuntu-latest
    needs: [inspect, attest]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: public-release-candidate
          path: release
      - name: Create draft from draft-inputs.txt
        shell: bash
        run: |
          mapfile -t assets < release/draft-inputs.txt
          for index in "${!assets[@]}"; do assets[$index]="release/${assets[$index]}"; done
          gh release create "${GITHUB_REF#refs/tags/}" "${assets[@]}" --draft --verify-tag --title "${GITHUB_REF#refs/tags/}"
        env:
          GH_TOKEN: ${{ github.token }}
