name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@1d0ff469b7ec7bdd22bd0b111c95a533f7f4f8fc
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:tauri
      - uses: actions/upload-artifact@65c4c4a1ddee5b7f698394829c2a0cc481feaf54
        with:
          name: release-macos
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app

  build-windows:
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@1d0ff469b7ec7bdd22bd0b111c95a533f7f4f8fc
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:release:win
      - uses: actions/upload-artifact@65c4c4a1ddee5b7f698394829c2a0cc481feaf54
        with:
          name: release-windows
          path: target/release/bundle/nsis/*.exe

  inspect:
    runs-on: ubuntu-latest
    needs: [build, build-windows]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          path: artifacts
      - run: npm ci
      - run: node scripts/public-release-policy.mjs inspect
        env:
          FRONDOSE_RELEASE_DIR: artifacts
      - run: sha256sum artifacts/release-macos/*.dmg artifacts/release-windows/*.exe > SHA256SUMS
      - run: node scripts/gen-latest-json.mjs
      - run: npx @cyclonedx/cyclonedx-npm --output-file sbom.cdx.json
      - name: Sign updater metadata
        run: minisign -S -s ~/.tauri/frondose.key -m latest.json -x latest.json.sig
      - name: Verify artifact signatures
        run: minisign -V -p ~/.tauri/frondose.pub -m latest.json -x latest.json.sig
      - uses: actions/upload-artifact@65c4c4a1ddee5b7f698394829c2a0cc481feaf54
        with:
          name: release-metadata
          path: |
            SHA256SUMS
            latest.json
            latest.json.sig
            sbom.cdx.json

  attest:
    runs-on: ubuntu-latest
    needs: inspect
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          path: artifacts
      - uses: actions/attest-build-provenance@520d128c1650ba5e8d51c3d2e39e6b4e5f1e4c4f
        with:
          subject-path: |
            artifacts/release-macos/*.dmg
            artifacts/release-windows/*.exe

  draft:
    runs-on: ubuntu-latest
    needs: attest
    environment: public-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          path: artifacts
      - run: npm ci
      - run: node scripts/public-release-policy.mjs inspect
        env:
          FRONDOSE_RELEASE_DIR: artifacts
      - run: |
          gh release create "${GITHUB_REF#refs/tags/}" artifacts/release-macos/* artifacts/release-windows/* \
            --draft \
            --verify-tag \
            --title "${GITHUB_REF#refs/tags/}" \
            --notes "Auto-generated by .github/workflows/release.yml on tag push."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
