name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # The schedule/cron mock tests compute against the operator's local clock
      # (UTC+8); pin the runner to the same zone so next-run math matches.
      TZ: Asia/Shanghai
      # ubuntu-latest ships Google Chrome at a fixed path; make it explicit for
      # chrome-launcher in the browser-owning mock tests.
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Full history: overlay/write-range contract tests pin committed diffs
          # by commit message (a depth=1 checkout has no searchable history).
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      # Linux system deps for the Rust fixture tests (glib/gtk via pkg-config) and
      # ripgrep for the release-policy scan tests.
      - run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev ripgrep
      # Prime the cargo registry cache (online) so the hermetic `cargo test
      # --offline` fixtures (serde_json at the lockfile-pinned version) resolve.
      - run: cargo fetch --locked --manifest-path src/tauri/src-tauri/Cargo.toml
      # T-WIN2.2b runs the real chmod-dist script against the built dist/ tree —
      # the mock suite contract requires a prior build (P-OSS-SINGLE-REPO).
      - run: npm run build
      - run: npm run test:fast

  macos:
    runs-on: macos-latest
    needs: check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:tauri

  windows:
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # build:tauri compiles TS + Tauri UI assets on Windows (the tagged release
      # pipeline owns signed installers; build-release.ps1 is intranet ops tooling).
      - run: npm run build:tauri

  public-export:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export public candidates
        run: |
          node --import tsx -e "import('./scripts/project-manifest.ts').then((m) => m.exportProjects({ repoRoot: process.cwd(), commit: process.env.GITHUB_SHA, outRoot: '/tmp/frondose-public' }))"

  license:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: npm ci
      - run: npx license-checker-rseidelsohn@5.0.1 --failOn 'AGPL;GPL;LGPL;UNLICENSED' --production --excludePackages '@kyoube/frondose'

  audit:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: npm ci
      - run: npm audit --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: npm ci
      - name: Scan exported production bytes
        run: node --import tsx scripts/public-scan.mjs
