[package]
name = "mai-tauri"
version = "0.5.0-alpha.27"
description = "mai-agent v0.5 hover-pivot Tauri shell (M-1 demo skeleton)"
edition = "2021"
rust-version = "1.75"

[[bin]]
name = "mai-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "net", "fs", "signal", "time"] }
hyper = { version = "0.14", features = ["client", "http1", "stream"] }
hyperlocal = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
bytes = "1"
libc = "0.2"  # rev-1 Step 3b NIT-N1 / CONCERN-LR-2 fix: explicit direct dep for libc::kill + libc::SIGTERM in shutdown_sidecar.
tauri-plugin-updater = { version = "2", features = [] }  # P-58d.1: app-native self-update (desktop-only build; no target qualifier needed — this app never targets mobile).
