<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Frondose</title>
  <style>
    :root {
      --brand-50: #EAF0F6;
      --brand-100: #CFE0EE;
      --brand-400: #3D74A8;
      --brand-600: #15487B;
      --brand-900: #0E2E50;
      --accent-50: #F8F1E3;
      --accent-100: #F4E5C9;
      --accent-400: #E3B972;
      --accent-500: #D9A75F;
      --accent-900: #80601E;
      --success: #46B54A;
      --warning: #D9A75F;
      --error: #B85547;
      --text-primary: #2A2A22;
      --text-secondary: #625E53;
      --text-muted: #8B8475;
      --text-inverse: #F7F1DA;
      --surface-bg: #F4F2EB;
      --surface-deep: #161A14;
      --surface-card: #FFFFFF;
      --surface-overlay: #232620;
      --line: var(--brand-100);
      --page-bg: var(--surface-bg);
      --panel-bg: var(--surface-card);
      --panel-ink: var(--text-primary);
      --panel-muted: var(--text-muted);
      --button-bg: var(--brand-600);
      --button-hover: var(--brand-900);
    }

    html.mode-auto,
    body.mode-auto {
      --page-bg: var(--surface-deep);
      --panel-bg: var(--surface-overlay);
      --panel-ink: var(--text-inverse);
      --panel-muted: var(--accent-100);
      --line: var(--accent-900);
      --button-bg: var(--accent-500);
      --button-hover: var(--accent-400);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--page-bg);
      color: var(--panel-ink);
      padding: 18px;
    }
    .shell {
      max-width: 920px;
      margin: 0 auto;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }
    .brand-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .brand-logo {
      width: 30px;
      height: 30px;
      flex: 0 0 auto;
    }
    .brand-word {
      color: var(--brand-600);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0;
    }
    html.mode-auto .brand-word { color: var(--text-inverse); }
    .mode-switcher {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-bg);
      min-width: 172px;
    }
    .mode-tab {
      min-height: 34px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--panel-muted);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }
    .mode-tab.active {
      background: var(--button-bg);
      color: var(--text-inverse);
      font-weight: 700;
    }
    .identity-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
    }
    #name {
      font-size: 18px;
      font-weight: 700;
      min-width: 0;
    }
    #name.error {
      color: var(--error);
      font-size: 14px;
      font-weight: 500;
    }
    #status {
      color: var(--text-secondary);
      font-size: 13px;
      min-height: 18px;
    }
    html.mode-auto #status { color: var(--accent-100); }
    button {
      min-height: 36px;
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      background: var(--button-bg);
      color: var(--text-inverse);
      font: inherit;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover:not(:disabled) { background: var(--button-hover); }
    button:disabled {
      background: var(--text-muted);
      cursor: not-allowed;
    }
    .workspace {
      display: grid;
      gap: 12px;
    }
    .composer {
      display: grid;
      gap: 8px;
    }
    #command-input {
      width: 100%;
      min-height: 74px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: var(--panel-bg);
      color: var(--panel-ink);
      font: inherit;
      font-size: 14px;
    }
    #command-input:disabled {
      color: var(--text-muted);
      background: var(--accent-50);
    }
    .send-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    #ticker,
    #cron-tick-banner {
      color: var(--brand-600);
      background: var(--brand-50);
      border: 1px solid var(--brand-100);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 13px;
    }
    html.mode-auto #ticker,
    html.mode-auto #cron-tick-banner {
      color: var(--accent-100);
      background: var(--surface-overlay);
      border-color: var(--accent-900);
    }
    #output {
      min-height: 50px;
      max-height: 300px;
      overflow-y: auto;
      white-space: pre-wrap;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: var(--panel-bg);
      color: var(--panel-ink);
      font-size: 13px;
    }
    #error-banner {
      color: var(--error);
      background: var(--accent-50);
      border: 1px solid var(--warning);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 13px;
    }
    .workflow-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: var(--panel-bg);
      color: var(--panel-ink);
      font-size: 13px;
    }
    .workflow-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }
    #workflow-title {
      font-size: 14px;
      font-weight: 700;
    }
    #workflow-mode {
      color: var(--panel-muted);
      font-size: 12px;
      white-space: nowrap;
    }
    #workflow-steps {
      display: grid;
      gap: 6px;
      margin: 0;
      padding-left: 18px;
    }
    .workflow-step {
      padding: 4px 0;
      color: var(--panel-muted);
    }
    .workflow-step.success,
    .workflow-step.auto-approved { color: var(--success); }
    .workflow-step.current { color: var(--brand-600); }
    .workflow-step.needs-you { color: var(--warning); font-weight: 700; }
    .workflow-step.failed { color: var(--error); }
    .workflow-progress-row {
      color: var(--text-secondary);
      font-family: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", monospace;
    }
    .workflow-notice {
      margin-top: 10px;
      border: 1px solid var(--warning);
      border-radius: 6px;
      padding: 8px;
      background: var(--accent-50);
      color: var(--text-primary);
    }
    .workflow-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .auto-stage {
      display: grid;
      gap: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      background: var(--panel-bg);
      color: var(--panel-ink);
    }
    .auto-hero {
      display: grid;
      grid-template-columns: 40px 1fr;
      gap: 10px;
      align-items: center;
    }
    .leaf-logo,
    .icon {
      width: 24px;
      height: 24px;
    }
    .auto-title {
      margin: 0;
      font-size: 18px;
    }
    .auto-meta {
      grid-column: 2;
      margin: 0;
      color: var(--panel-muted);
      font-size: 13px;
    }
    .auto-progress-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(72px, 1fr));
      gap: 6px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .auto-progress-strip li {
      min-height: 8px;
      border-radius: 6px;
      overflow: hidden;
      text-indent: 100%;
      white-space: nowrap;
      background: var(--line);
    }
    .auto-progress-strip li.success,
    .auto-progress-strip li.auto-approved { background: var(--success); }
    .auto-progress-strip li.current,
    .auto-progress-strip li.needs-you { background: var(--accent-500); }
    .auto-timeline {
      display: grid;
      gap: 8px;
    }
    .timeline-row {
      display: grid;
      grid-template-columns: 14px 1fr auto;
      gap: 8px;
      align-items: center;
      font-size: 13px;
    }
    .timeline-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--line);
    }
    .timeline-row.success .timeline-dot,
    .timeline-row.auto-approved .timeline-dot { background: var(--success); }
    .timeline-row.current .timeline-dot,
    .timeline-row.needs-you .timeline-dot { background: var(--accent-500); }
    .timeline-chip {
      color: var(--panel-muted);
      font-family: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", monospace;
      font-size: 12px;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div id="brand-bar" class="brand-bar">
        <img class="brand-logo" src="./frondose-logo-mark.svg" alt="Frondose" />
        <span class="brand-word">Frondose</span>
      </div>
      <div class="mode-switcher" role="tablist" aria-label="Mode">
        <button id="mode-manual-tab" class="mode-tab active" type="button" role="tab">Manual</button>
        <button id="mode-auto-tab" class="mode-tab" type="button" role="tab">Auto</button>
      </div>
    </header>
    <section class="identity-row">
      <div>
        <div id="name">loading identity...</div>
        <div id="status">Listening</div>
      </div>
      <button id="start" type="button">Start LinkedIn</button>
    </section>
    <section class="workspace">
      <div class="composer">
        <textarea id="command-input" class="hidden" placeholder="Ask Frondose"></textarea>
        <div class="send-row">
          <button id="send-btn" class="hidden" type="button">Send</button>
        </div>
      </div>
      <div id="ticker" class="hidden"></div>
      <div id="workflow-card" class="workflow-card hidden">
        <div class="workflow-head">
          <strong id="workflow-title">workflow</strong>
          <span id="workflow-mode">Manual</span>
        </div>
        <ol id="workflow-steps"></ol>
        <div id="workflow-notice" class="workflow-notice hidden"></div>
        <div class="workflow-actions">
          <button id="workflow-approve-btn" class="hidden" type="button">Approve</button>
          <button id="workflow-decline-btn" class="hidden" type="button">Decline</button>
          <button id="workflow-handoff-btn" class="hidden" type="button" title="Pre-approve remaining steps">Hand off to Auto</button>
        </div>
      </div>
      <div id="auto-stage" class="auto-stage hidden"></div>
      <div id="output" class="hidden"></div>
      <div id="error-banner" class="hidden">error</div>
      <button id="retry-btn" class="hidden" type="button">Retry</button>
      <div id="cron-tick-banner" class="hidden"></div>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
