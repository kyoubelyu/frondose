<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>mai</title>
  <style>
    body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: #fafafa; color: #222; padding: 16px; }
    h1 { margin: 0 0 12px 0; font-size: 16px; font-weight: 600; color: #555; }
    #name { font-size: 18px; font-weight: 600; margin-bottom: 12px; }
    #name.error { color: #c0392b; font-size: 14px; font-weight: 400; }
    #status { font-size: 12px; color: #666; margin-bottom: 12px; min-height: 16px; }
    button { background: #0a66c2; color: white; border: none; padding: 8px 16px; border-radius: 4px; font-size: 14px; cursor: pointer; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    button:hover:not(:disabled) { background: #084e93; }
    .auto-mode-btn { background: #0a8540; color: white; padding: 6px 12px; border: 0; border-radius: 4px; cursor: pointer; margin: 4px 0; font-size: 13px; }
    #command-input { width: 100%; min-height: 60px; padding: 8px; box-sizing: border-box; font-size: 14px; font-family: inherit; resize: vertical; border: 1px solid #ccc; border-radius: 4px; }
    #command-input:disabled { background: #f0f0f0; }
    .send-row { display: flex; gap: 8px; margin: 8px 0; align-items: center; }
    #ticker { font-size: 13px; color: #0a66c2; font-style: italic; padding: 6px 10px; background: #e7f0fa; border-radius: 4px; margin: 8px 0; }
    #output { font-size: 13px; color: #333; white-space: pre-wrap; padding: 8px; background: #fff; border: 1px solid #ddd; border-radius: 4px; max-height: 300px; overflow-y: auto; margin-top: 8px; min-height: 40px; }
    #error-banner { font-size: 13px; color: #c0392b; padding: 8px 12px; background: #fdecea; border: 1px solid #f5c6cb; border-radius: 4px; margin: 8px 0; }
    .workflow-card { background: #fff; border: 1px solid #d7dce2; border-radius: 6px; padding: 10px 12px; margin: 10px 0; font-size: 13px; }
    .workflow-head { display: flex; justify-content: space-between; gap: 8px; align-items: center; margin-bottom: 8px; }
    #workflow-mode { color: #666; font-size: 12px; }
    #workflow-steps { margin: 0; padding-left: 20px; }
    #workflow-steps li { margin: 4px 0; }
    #workflow-steps li.pending-approval { color: #9b5d00; font-weight: 600; }
    .workflow-notice { color: #8a5a00; background: #fff5d6; border: 1px solid #f1d48b; border-radius: 4px; padding: 6px 8px; margin-top: 8px; }
    .workflow-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <h1>mai</h1>
  <div id="name">loading identity...</div>
  <div id="status"></div>
  <button id="start">Start LinkedIn</button>
  <button id="auto-mode-toggle" class="auto-mode-btn">Auto-mode: ON</button>
  <button id="passive-mode-toggle" class="auto-mode-btn">Magical click: OFF</button>
  <textarea id="command-input" class="hidden" placeholder="Ask mai (e.g. 'qualify this profile')"></textarea>
  <div class="send-row">
    <button id="send-btn" class="hidden">Send</button>
  </div>
  <div id="ticker" class="hidden"></div>
  <div id="workflow-card" class="workflow-card hidden">
    <div class="workflow-head">
      <strong id="workflow-title">mai · workflow</strong>
      <span id="workflow-mode">Manual</span>
    </div>
    <ol id="workflow-steps"></ol>
    <div id="workflow-notice" class="workflow-notice hidden"></div>
    <div class="workflow-actions">
      <button id="workflow-approve-btn" class="hidden">Approve</button>
      <button id="workflow-decline-btn" class="hidden">Decline</button>
      <button id="workflow-handoff-btn" class="hidden" title="Pre-approve remaining steps">Hand off to Auto</button>
    </div>
  </div>
  <div id="output" class="hidden"></div>
  <div id="error-banner" class="hidden">error</div>
  <button id="retry-btn" class="hidden">Retry</button>
  <div id="cron-tick-banner" class="hidden"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
