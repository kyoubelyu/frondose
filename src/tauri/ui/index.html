<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mai</title>
  <style>
    body { margin: 0; padding: 24px; font: 14px/1.4 -apple-system, BlinkMacSystemFont, system-ui;

    h1 { font-size: 18px; font-weight: 600; margin: 0 0 16px; }
